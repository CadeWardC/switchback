name: GPS traces along trails (Switchback)

# Read-only pilot (scripts/gps_traces.py): how much of each trail in a box people have recorded GPS tracks along,
# from OpenStreetMap's public traces. Changes nothing.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Trail pack, e.g. missouri"
        default: "missouri"
      box:
        description: "south,west,north,east (keep it small: a county)"
        default: "38.75,-92.45,39.0,-92.05"
      pages:
        description: "Most pages of 5,000 points to read per quarter-degree tile"
        default: "40"

permissions:
  contents: read

jobs:
  traces:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet osmium shapely numpy
      - run: curl -fsSL --retry 4 -o pack.trails "https://github.com/${{ github.repository }}/releases/download/trails-us/${{ inputs.region }}.trails"
      - run: python3 scripts/gps_traces.py pack.trails "${{ inputs.box }}" "${{ inputs.pages }}"
