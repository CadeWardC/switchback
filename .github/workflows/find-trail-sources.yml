name: Find official trail sources (Switchback)

# Read-only: lists public official trail datasets for a place (scripts/find_trail_sources.py). Changes nothing.

on:
  workflow_dispatch:
    inputs:
      words:
        description: "Search words"
        default: "Missouri trails;Missouri Department of Conservation trails;Missouri State Parks trails;Corps of Engineers trails Missouri;National Digital Trails;National Park Service trails"
      box:
        description: "south,west,north,east"
        default: "36.0,-95.8,40.6,-89.1"
      wfs:
        description: "WFS layers to probe: url|typename;url|typename"
        default: ""
      skip_national:
        description: "Skip the US national services (any text)"
        default: ""
      compact:
        description: "One line per layer, and only layers with at least this many trails (e.g. 50)"
        default: ""
  push:
    branches: ["**"]
    paths:
      - "scripts/find_trail_sources.py"
      - ".github/workflows/find-trail-sources.yml"

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Search
        env:
          WFS: ${{ inputs.wfs }}
          SKIP_NATIONAL: ${{ inputs.skip_national }}
          COMPACT: ${{ inputs.compact }}
          MIN_COUNT: ${{ inputs.compact }}
        run: python3 scripts/find_trail_sources.py "${{ inputs.words || 'Missouri trails;Missouri Department of Conservation trails;Missouri State Parks trails;Corps of Engineers trails Missouri;National Digital Trails;National Park Service trails' }}" "${{ inputs.box || '36.0,-95.8,40.6,-89.1' }}"
