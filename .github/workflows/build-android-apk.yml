name: Build Android APK (Switchback app)

# Builds the Switchback app for Android (the website in web/, wrapped with Capacitor) as a debug APK and
# publishes it as a switchback-android-build-N release. A debug APK is signed with a throwaway debug key:
# fine for installing by hand, not for a store.

on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - "Switchback/Resources/switchback-style*.json" # the map style the app is built from
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: switchback-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Capacitor 8's Android projects compile for Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the web app and copy it into the Android project
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          # the app downloads trail files itself; none are packed in
          node scripts/strip-app.mjs
          npx cap sync android

      - name: Build the debug APK
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          # the web app and the map's worker must be inside
          unzip -l "$APK" | grep -q "assets/public/index.html"
          unzip -l "$APK" | grep -q "assets/public/assets/maplibre-worker-.*\.js"
          unzip -l "$APK" | grep -q "assets/public/styles/light.json"
          cp "$APK" "$GITHUB_WORKSPACE/Switchback-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/Switchback-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Switchback-debug-apk
          path: Switchback-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="switchback-android-build-${{ github.run_number }}"
          gh release create "$TAG" Switchback-debug.apk \
            --target "${{ github.sha }}" \
            --title "Switchback for Android (debug) #${{ github.run_number }}" \
            --notes "Switchback for Android, a debug build from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Download Switchback-debug.apk on the phone and open it; Android asks you to allow installing from your browser or files app." \
            --latest=false
