name: Build Android APK (Switchback app)

# Builds the Switchback app for Android (the website in web/, wrapped with Capacitor) and publishes it as a
# switchback-android-build-N release:
#   Switchback.apk        the release build (R8 removes unused code and resources: about 2 MB)
#   Switchback-debug.apk  the debug build (unshrunk, about 7 MB), for looking into problems
# Both are signed with a throwaway debug key for now: fine for installing by hand, not for a store.

on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - "Switchback/Resources/switchback-style*.json" # the map style the app is built from
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: switchback-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Capacitor 8's Android projects compile for Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the web app and copy it into the Android project
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          # the app downloads trail files itself; none are packed in
          node scripts/strip-app.mjs
          npx cap sync android

      - name: Build the release and debug APKs
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --console=plain
          for kind in release debug; do
            APK=app/build/outputs/apk/$kind/app-$kind.apk
            test -f "$APK"
            # the web app and the map's worker must be inside
            unzip -l "$APK" | grep -q "assets/public/index.html"
            unzip -l "$APK" | grep -q "assets/public/assets/maplibre-worker-.*\.js"
            unzip -l "$APK" | grep -q "assets/public/styles/light.json"
          done
          # shrinking must not have removed a plugin the web side calls by name
          unzip -p app/build/outputs/apk/release/app-release.apk assets/capacitor.plugins.json \
            | python3 -c "import json, sys; print('\n'.join(p['classpath'] for p in json.load(sys.stdin)))" > plugins.txt
          mkdir -p dex && unzip -q -o app/build/outputs/apk/release/app-release.apk 'classes*.dex' -d dex
          while read -r c; do
            grep -qa "L$(echo "$c" | tr . /);" dex/classes*.dex || { echo "the release build lost $c"; exit 1; }
          done < plugins.txt
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Switchback.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Switchback-debug.apk"
          ls -lh "$GITHUB_WORKSPACE"/Switchback*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Switchback-apk
          path: |
            Switchback.apk
            Switchback-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="switchback-android-build-${{ github.run_number }}"
          gh release create "$TAG" Switchback.apk Switchback-debug.apk \
            --target "${{ github.sha }}" \
            --title "Switchback for Android #${{ github.run_number }}" \
             --notes "Switchback for Android, built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Download Switchback.apk on the phone and open it; Android asks you to allow installing from your browser or files app. (Switchback-debug.apk is the same app unshrunk, for looking into problems.)" \
            --latest=false
