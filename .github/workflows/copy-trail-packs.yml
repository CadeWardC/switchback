name: Copy trail packs from Edge (Switchback)

# Fills in the areas this repo's "trails-us" release doesn't have yet with the ones already built in CadeWardC/Edge,
# so the app has every area while the rebuild runs. It never replaces a file that's already here (the rebuild's
# files are newer), then rebuilds the list of areas (regions.json).

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/copy-trail-packs.yml"

permissions:
  contents: write

concurrency:
  group: copy-trail-packs
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  FROM: CadeWardC/Edge
  TAG: trails-us

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Copy every area that isn't here yet
        run: |
          have=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[] | select(.size > 0) | .name')
          want=$(gh release view "$TAG" -R "$FROM" --json assets -q '.assets[].name' | grep -E '\.(trails|json)$' | grep -vx regions.json)
          mkdir -p c && cd c
          n=0
          for f in $want; do
            grep -qx "$f" <<< "$have" && continue
            gh release download "$TAG" -R "$FROM" -p "$f" --clobber < /dev/null
            # no --clobber: if the rebuild published this area meanwhile, keep its newer file
            gh release upload "$TAG" "$f" -R "$REPO" < /dev/null && n=$((n + 1)) || echo "kept the file already here: $f"
            rm -f "$f"
          done
          echo "copied $n files"

      - name: Build and publish the list of areas (regions.json)
        run: |
          mkdir -p idx
          gh release download "$TAG" -R "$REPO" -p "*.json" -D idx --clobber
          rm -f idx/regions.json
          python3 - <<'PY'
          import json, glob
          regions, total, trails = {}, 0, 0
          for f in sorted(glob.glob("idx/*.json")):
              i = json.load(open(f))
              if not i.get("bbox"):
                  continue
              regions[i["region"]] = i
              total += i["bytes"]; trails += i.get("trails", 0)
          json.dump({"regions": regions}, open("regions.json", "w"), separators=(",", ":"))
          print(f"{len(regions)} regions, {trails} trails, {total / 1024 / 1024:.1f} MB in all")
          PY
          gh release upload "$TAG" regions.json -R "$REPO" --clobber
