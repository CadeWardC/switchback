name: Match park maps to our trails (Switchback)

# Lays each park map that carries real coordinates (data/park-maps/<region>.json) over our trails: finds the trail
# the map highlights, and says which of our lines it is. Results (facts only: names, shares, lengths) go to the
# working release "park-maps-work" as matches-<region>.json. Only by hand.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region id"
        default: "missouri"
      park:
        description: "Only parks whose slug contains this (empty = all)"
        default: ""
      keep:
        description: "Also put the map files and overlay pictures in the working release (for checking)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install map tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin poppler-utils
          pip install --quiet numpy pillow
      - name: Get our trails
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download trails-us -p "${{ inputs.region }}.trails" -p "${{ inputs.region }}.json" -D pack
      - name: Match
        env:
          KEEP: ${{ inputs.keep && '1' || '' }}
        run: python3 scripts/match_park_maps.py "${{ inputs.region }}" pack out "${{ inputs.park }}"
      - name: Publish the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: ls out/* | xargs -n 40 gh release upload park-maps-work --clobber
