name: Base maps (pilot)

# Pilot: how big is a whole state's base map as one file the app could download with the state's trails, so
# maps are offline by default? Builds Missouri with Planetiler (OpenMapTiles layers, the same ones the app's
# map style already draws) several ways and reports the sizes, and where the bytes go by zoom and by layer
# (scripts/measure_base_map.py). Nothing is published.
#
# The ways answer three questions: what do place names in 70 languages cost (full against one-language), what
# do buildings, house numbers and shop pins cost (one-language against trail), and what does the last zoom
# cost (trail at zoom 14, 13 and 12).

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/base-maps.yml"
      - "scripts/measure_base_map.py"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OSM_URL: https://download.geofabrik.de/north-america/us/missouri-latest.osm.pbf
      OSM: --osm-path=missouri.osm.pbf --osm-url=https://download.geofabrik.de/north-america/us/missouri-latest.osm.pbf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch Planetiler
        run: curl -fsSLo planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
      - name: Download the Missouri extract
        # ourselves, as the trail packs do: Planetiler's own lookup of an area by name (--area) can no longer
        # read Geofabrik's list of extracts
        # Geofabrik first (it has refused connections from the runner), then OpenStreetMap France's copy
        run: |
          curl -fsSL --retry 4 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o missouri.osm.pbf "$OSM_URL" \
            || curl -fsSL --retry 4 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o missouri.osm.pbf \
                 https://download.openstreetmap.fr/extracts/north-america/us/missouri-latest.osm.pbf
          ls -lh missouri.osm.pbf
      - name: Everything (zoom 14, every language), as the app gets it from OpenFreeMap today
        run: |
          java -Xmx5g -jar planetiler.jar --download $OSM --output=full-z14.pmtiles --force
      - name: Names in one language
        run: |
          java -Xmx5g -jar planetiler.jar $OSM --output=one-language-z14.pmtiles --languages=en --force
      - name: Trail map, zoom 14 (one language, without buildings, house numbers and shop pins)
        run: |
          java -Xmx5g -jar planetiler.jar $OSM --output=trail-z14.pmtiles --languages=en \
            --exclude-layers=building,housenumber,poi,aerodrome_label --force
      - name: Trail map, zoom 13
        run: |
          java -Xmx5g -jar planetiler.jar $OSM --output=trail-z13.pmtiles --maxzoom=13 --languages=en \
            --exclude-layers=building,housenumber,poi,aerodrome_label --force
      - name: Trail map, zoom 12
        run: |
          java -Xmx5g -jar planetiler.jar $OSM --output=trail-z12.pmtiles --maxzoom=12 --languages=en \
            --exclude-layers=building,housenumber,poi,aerodrome_label --force
      - name: Sizes
        if: always()
        run: |
          echo "### Missouri base map, one file" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l --block-size=M *.pmtiles | awk '{print $5, $9}' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Where the bytes go, by zoom and by layer
        if: always()
        continue-on-error: true
        run: |
          pip install --quiet pmtiles
          echo "### Where the bytes go" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/measure_base_map.py full-z14.pmtiles trail-z14.pmtiles | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missouri-base-map-trail
          path: |
            trail-z14.pmtiles
            trail-z13.pmtiles
          retention-days: 7
