name: Build trail packs (Switchback)

# Turns OpenStreetMap extracts from Geofabrik (the areas in data/trail-regions.json: US states, Canadian provinces,
# Switzerland, …) into Switchback's trail packs: one compact file per area
# (<state>.trails) plus a small summary (<state>.json), all in the single release "trails-us", with the list of
# states (regions.json). Monthly (trails change slowly), by hand, or when the builder changes.

on:
  schedule:
    - cron: "17 7 1 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Areas to build, space separated ids from data/trail-regions.json (empty: all)"
        default: ""
  push:
    branches: ["**"]
    paths:
      - "scripts/build_trail_pack.py"
      - "scripts/enrich_trail_pack.py"
      - "scripts/check_official_trails.py"
      - "scripts/elevation.py"
      - "scripts/export_open_data.py"
      - "scripts/ways_in.py"
      - "data/parks/**"

permissions:
  contents: write

# a run of named areas has its own queue, so it neither waits behind a full rebuild nor is dropped when another
# full rebuild is queued
concurrency:
  group: trail-packs${{ inputs.only && format('-{0}', inputs.only) || '' }}
  cancel-in-progress: false

jobs:
  # the areas to build: data/trail-regions.json (any Geofabrik extract; add more there to cover more of the
  # world),
  # or just the ones named when run by hand
  regions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          ONLY: ${{ inputs.only }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          regions = json.load(open("data/trail-regions.json"))
          only = os.environ.get("ONLY", "").split()
          unknown = [o for o in only if o not in {r["id"] for r in regions}]
          if unknown:
              sys.exit("not in data/trail-regions.json: " + " ".join(unknown))
          print("list=" + json.dumps([r for r in regions if not only or r["id"] in only]))
          PY

  pack:
    needs: regions
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region: ${{ fromJSON(needs.regions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium, shapely, numpy and pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install --quiet osmium shapely numpy pillow

      - name: Download the ${{ matrix.region.name }} extract
        run: |
          curl -fsSL --retry 5 --retry-delay 15 -o region.osm.pbf \
            "https://download.geofabrik.de/${{ matrix.region.path }}-latest.osm.pbf"
          ls -lh region.osm.pbf

      - name: Keep only trails, routes, parks, trailheads, parking and trail highlights
        run: |
          osmium tags-filter region.osm.pbf \
            r/route=hiking,foot,walking w/highway=path,footway,bridleway,track,cycleway \
            nwr/boundary=protected_area,national_park nwr/leisure=park,nature_reserve \
            n/tourism=viewpoint,alpine_hut,wilderness_hut,camp_site,picnic_site \
            n/natural=peak,volcano,spring,cave_entrance n/waterway=waterfall \
            n/amenity=drinking_water,water_point,toilets,shelter nw/amenity=parking \
            n/highway=trailhead n/information=trailhead nwr/natural=water \
            -o trails.osm.pbf --overwrite
          ls -lh trails.osm.pbf

      - name: Build the packs
        run: |
          export TERRAIN_CACHE="$RUNNER_TEMP/terrain"
          PACK_VERSION=$(date -u +%Y%m%d%H%M) python3 scripts/build_trail_pack.py trails.osm.pbf "${{ matrix.region.id }}" out "${{ matrix.region.country }}" "${{ matrix.region.name }}"
          du -sh out

      - name: Add what official trail lists know (names, informal trails, federal trails we lack)
        # never blocks publishing: if the official lists can't be reached the pack goes out as built
        continue-on-error: true
        timeout-minutes: 75
        run: |
          export TERRAIN_CACHE="$RUNNER_TEMP/terrain"
          python3 scripts/enrich_trail_pack.py out "${{ matrix.region.id }}"

      - name: Say which trails each way in follows ("via Ridge Trail")
        # after the official names are in, so the names are the ones the app shows; never blocks publishing
        continue-on-error: true
        run: python3 scripts/ways_in.py out "${{ matrix.region.id }}"

      - name: Check the hikes are cohesive (pieces of one trail, webs, loops left open)
        # counts go into the area's summary so each build can be compared with the last; the worst are listed here
        continue-on-error: true
        run: python3 scripts/trail_quality.py out "${{ matrix.region.id }}" --list 15

      - name: Write the open file (GeoJSON) anyone can download
        continue-on-error: true
        run: python3 scripts/export_open_data.py out "${{ matrix.region.id }}" open

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view trails-us > /dev/null 2>&1 || gh release create trails-us --target "${{ github.sha }}" \
            --title "Switchback trail packs (US)" --latest=false \
            --notes "Trails for Switchback built from OpenStreetMap (© OpenStreetMap contributors, ODbL) via Geofabrik: one file per state plus regions.json. Rebuilt monthly." || true
          for i in 1 2 3 4; do gh release upload trails-us out/* --clobber && break; sleep $((i * 15)); done
          if ls open/*.geojson.gz > /dev/null 2>&1; then
            gh release view trails-open > /dev/null 2>&1 || gh release create trails-open --target "${{ github.sha }}" \
              --title "Trails, open files (GeoJSON)" --latest=false \
              --notes "Every trail in Switchback's dataset as GeoJSON, one gzipped file per US state and Canadian province. Lines from OpenStreetMap (© OpenStreetMap contributors, ODbL) and, where OpenStreetMap has none, from the U.S. Forest Service and National Park Service (public domain). See docs/DOWNLOADS.md." || true
            for i in 1 2 3 4; do gh release upload trails-open open/*.geojson.gz --clobber && break; sleep $((i * 15)); done
          fi

  index:
    needs: pack
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build the list of states (regions.json)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p idx
          gh release download trails-us -R "$REPO" -p "*.json" -D idx --clobber
          rm -f idx/regions.json
          python3 - <<'PY'
          import json, glob
          regions, total, trails = {}, 0, 0
          for f in sorted(glob.glob("idx/*.json")):
              i = json.load(open(f))
              if not i.get("bbox"):
                  continue
              regions[i["region"]] = i
              total += i["bytes"]; trails += i.get("trails", 0)
          json.dump({"regions": regions}, open("regions.json", "w"), separators=(",", ":"))
          print(f"{len(regions)} regions, {trails} trails, {total / 1024 / 1024:.1f} MB in all")
          for name, r in sorted(regions.items(), key=lambda kv: -kv[1]["bytes"]):
              print(f"  {name:<22} {r['bytes'] / 1024:8.0f} KB  {r.get('trails', 0):7d} trails")
          PY
      - name: Publish regions.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release upload trails-us regions.json -R "$REPO" --clobber
