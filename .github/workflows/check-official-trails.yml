name: Check trails against official lists (Switchback)

# Read-only report: checks every trail in every area's pack (all US states and Canadian provinces, or the ones named)
# against the official trail lists: USGS, Forest Service and National Park Service in the US, Parks Canada and the
# Trans Canada Trail in Canada, and each state's or province's own lists (state parks, conservation, provincial parks,
# cities). scripts/check_official_trails.py; changes nothing. One report per area, plus a combined summary.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Areas to check, space separated (empty: all)"
        default: ""
  push:
    branches: ["**"]
    paths:
      - "scripts/check_official_trails.py"
      - ".github/workflows/check-official-trails.yml"

permissions:
  contents: read

concurrency:
  group: check-official-trails
  cancel-in-progress: true

jobs:
  areas:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          ONLY: ${{ inputs.only }}
        run: |
          curl -fsSL --retry 4 -o regions.json "https://github.com/${{ github.repository }}/releases/download/trails-us/regions.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          regions = json.load(open("regions.json"))["regions"]
          only = os.environ.get("ONLY", "").split()
          ids = sorted(r for r in regions if not only or r in only)
          # biggest first, so the long ones start early
          ids.sort(key=lambda r: -regions[r].get("bytes", 0))
          print("list=" + json.dumps(ids))
          PY

  check:
    needs: areas
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        region: ${{ fromJSON(needs.areas.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the builder's helpers
        run: pip install --quiet osmium shapely numpy
      - name: Download the trail pack
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/trails-us"
          curl -fsSL --retry 4 -o pack.trails "$base/${{ matrix.region }}.trails"
          curl -fsSL --retry 4 -o regions.json "$base/regions.json"
          python3 -c "import json; json.dump(json.load(open('regions.json'))['regions']['${{ matrix.region }}'], open('region.json', 'w'))"
      - name: Compare with the official trail lists
        run: |
          mkdir -p out
          python3 scripts/check_official_trails.py pack.trails region.json "out/${{ matrix.region }}.md" "out/${{ matrix.region }}.json"
      - name: Save the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.region }}
          path: out/
          if-no-files-found: ignore

  combine:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: out
          merge-multiple: true
      - name: Combine
        run: |
          python3 - <<'PY'
          import glob, json
          rows = [json.load(open(f)) for f in sorted(glob.glob("out/*.json"))]
          cols = ["named", "named_ok", "named_none", "named_none_park", "named_not_hike",
                  "un", "un_ok", "un_name", "un_not_hike", "un_none", "un_none_out", "miss", "miss_mi", "miss_q", "miss_q_mi"]
          md = ["# All areas: trail packs vs official trail lists", "",
                "Confirmed = at least 70% of the trail lies on an official list's line. Missing = official trails open to",
                "hikers (joined into whole trails, 0.25 mi or longer) that aren't in the pack.", "",
                "| Area | Lists | Named | confirmed | on no list (in a park) | not for hikers | Unnamed | confirmed | can take a name | not for hikers | on no list (outside parks) | Missing hiking trails | + use unknown |",
                "|---|---|---|---|---|---|---|---|---|---|---|---|---|"]
          tot = dict.fromkeys(cols, 0)
          def park(d, inside):
              return sum(v for k, v in d.get("none_by_place", {}).items() if k.startswith("in a park") == inside)
          for r in rows:
              n, u = r.get("Named trails", {}), r.get("Unnamed lines", {})
              ls = r["lists"].values()
              v = dict(named=n.get("total", 0), named_ok=n.get("confirmed", 0), named_none=n.get("none", 0),
                       named_none_park=park(n, True), named_not_hike=n.get("not_for_hikers", 0),
                       un=u.get("total", 0), un_ok=u.get("confirmed", 0), un_name=u.get("nameable", 0),
                       un_not_hike=u.get("not_for_hikers", 0), un_none=u.get("none", 0), un_none_out=park(u, False),
                       miss=sum(l.get("missing", 0) for l in ls), miss_mi=sum(l.get("missing_miles", 0) for l in ls),
                       miss_q=sum(l.get("missing_unknown_use", 0) for l in ls),
                       miss_q_mi=sum(l.get("missing_unknown_miles", 0) for l in ls))
              lists = len([l for l in ls if l.get("pieces")])
              for k in cols:
                  tot[k] += v[k]
              md.append(f"| {r['name']} | {lists} | {v['named']} | {v['named_ok']} | {v['named_none']} ({v['named_none_park']}) | "
                        f"{v['named_not_hike']} | {v['un']} | {v['un_ok']} | {v['un_name']} | {v['un_not_hike']} | "
                        f"{v['un_none']} ({v['un_none_out']}) | {v['miss']} ({v['miss_mi']} mi) | {v['miss_q']} ({v['miss_q_mi']} mi) |")
          t = tot
          md.append(f"| **All {len(rows)} areas** | | {t['named']} | {t['named_ok']} | {t['named_none']} ({t['named_none_park']}) | "
                    f"{t['named_not_hike']} | {t['un']} | {t['un_ok']} | {t['un_name']} | {t['un_not_hike']} | "
                    f"{t['un_none']} ({t['un_none_out']}) | {t['miss']} ({t['miss_mi']} mi) | {t['miss_q']} ({t['miss_q_mi']} mi) |")
          open("out/ALL.md", "w").write("\n".join(md) + "\n")
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-reports
          path: out/
