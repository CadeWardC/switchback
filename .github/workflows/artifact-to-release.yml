name: Copy a run's file to the working release (Switchback)

# Copies an artifact of a finished workflow run into the working release "park-maps-work", so diagnostics can be read.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id"
        required: true
      name:
        description: "Artifact name"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: got
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload park-maps-work got/* --clobber -R "${{ github.repository }}"
