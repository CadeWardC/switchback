<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Switchback: find trails, follow them, record your hikes</title>
    <meta name="description" content="Hiking trails across the US and Canada on an open map: length, climb, difficulty, elevation charts and GPX downloads. Plan a route or record a walk. No account needed." />
    <meta name="theme-color" content="#edf0ec" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Switchback" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/favicon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      /* before the app loads: the right background, no flash */
      html { background: #edf0ec; }
      @media (prefers-color-scheme: dark) { html { background: #0d1512; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript><p style="font-family: system-ui; padding: 24px">Switchback needs JavaScript to show the map and trails.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
